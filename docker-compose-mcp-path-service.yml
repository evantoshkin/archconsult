services:
  mcp-path-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-path-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - NEBULA_HOST=${NEBULA_HOST:-graphd}
      - NEBULA_PORT=${NEBULA_PORT:-9669}
      - NEBULA_USER=${NEBULA_USER:-root}
      - NEBULA_PASSWORD=${NEBULA_PASSWORD:-nebula}
      - SEARCH_DEPTH_DAYS=${SEARCH_DEPTH_DAYS:-30}
      - MAX_PATH_DEPTH=${MAX_PATH_DEPTH:-7}
      - PATH_LIMIT=${PATH_LIMIT:-100}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - ./logs:/app/logs
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
