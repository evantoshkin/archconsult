services:
  mcp-path-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-path-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-rsm}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_POOL_MIN_SIZE=${POSTGRES_POOL_MIN_SIZE:-1}
      - POSTGRES_POOL_MAX_SIZE=${POSTGRES_POOL_MAX_SIZE:-10}
      - AGE_GRAPH_NAME=${AGE_GRAPH_NAME:-rsm_eotar_interface}
      - PATH_SEARCH_LIMIT=${PATH_SEARCH_LIMIT:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-30000}
      - NEBULA_HOST=${NEBULA_HOST:-graphd}
      - NEBULA_PORT=${NEBULA_PORT:-9669}
      - NEBULA_USER=${NEBULA_USER:-root}
      - NEBULA_PASSWORD=${NEBULA_PASSWORD:-nebula}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      - ./logs:/app/logs
    networks:
      - mcp-network

  # Graph DB for LightRAG
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/archconsult
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "always"
    networks:
      - mcp-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    env_file:
      - environment/n8n.env
    depends_on:
      - postgres
    restart: "always"
    networks:
      - mcp-network

  n8n-task-runners:
    image: n8niop/runners/nebula:latest
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=123
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=3600
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
      - N8N_RUNNERS_TASK_TIMEOUT=3600
    depends_on:
      - n8n
    networks:
      - mcp-network

  postgres:
    image: postgre-pgvector-age:latest # with vector extension
    ports:
      - "5435:5432"
    env_file:
      - environment/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init-scripts/pg:/docker-entrypoint-initdb.d
    restart: "always"
    networks:
      - mcp-network

  metad0:
    image: docker.io/vesoft/nebula-metad:v3.8.0
    environment:
      USER: root
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=metad0
      - --ws_ip=metad0
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad0:19559/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9559:9559
      - 19559:19559
      - 19560
    volumes:
      - ./data/meta0:/data/meta
      - ./logs/meta0:/logs
    networks:
      - mcp-network
    restart: on-failure
    cap_add:
      - SYS_PTRACE

  storaged0:
    image: docker.io/vesoft/nebula-storaged:v3.8.0
    environment:
      USER: root
      TZ:   "${TZ}"
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=storaged0
      - --ws_ip=storaged0
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      - metad0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://storaged0:19779/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9779:9779
      - 19779:19779
      - 19780
    volumes:
      - ./data/storage0:/data/storage
      - ./logs/storage0:/logs
    networks:
      - mcp-network
    restart: on-failure
    cap_add:
      - SYS_PTRACE

  graphd:
    image: docker.io/vesoft/nebula-graphd:v3.8.0
    environment:
      USER: root
      TZ:   "${TZ}"
    command:
      - --meta_server_addrs=metad0:9559
      - --port=9669
      - --local_ip=graphd
      - --ws_ip=graphd
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      - storaged0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://graphd:19669/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9670:9669
      - 19669:19669
      - 19670
    volumes:
      - ./logs/graph:/logs
    networks:
      - mcp-network
    restart: on-failure
    cap_add:
      - SYS_PTRACE

  nebula-studio:
    image: docker.io/vesoft/nebula-graph-studio:latest
    ports:
      - 7001:7001
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
