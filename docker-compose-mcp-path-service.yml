services:
  mcp-path-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-path-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-rsm}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_POOL_MIN_SIZE=${POSTGRES_POOL_MIN_SIZE:-1}
      - POSTGRES_POOL_MAX_SIZE=${POSTGRES_POOL_MAX_SIZE:-10}
      - AGE_GRAPH_NAME=${AGE_GRAPH_NAME:-rsm_eotar_interface}
      - PATH_SEARCH_LIMIT=${PATH_SEARCH_LIMIT:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-30000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      - ./logs:/app/logs
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
