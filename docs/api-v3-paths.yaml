openapi: 3.1.0
info:
  title: MCP Path Service — /api/v3/paths
  version: 0.2.0
  description: >
    Поиск путей интеграции. Возвращает отрезки source -> destination.

    Направление каждого отрезка определяется по стрелке ребра в графе:
      - `->` (FORWARD): source (consumer/requester) → destination (provider/responder)
      - `<-` (REVERSE): source (consumer/requester) ← destination (provider/responder)

    Параметр `source` определяет тип ребра для поиска:
      - `vision` — VISION_INTERFACE_SYSTEM_LEVEL
      - `interface_registry` — INTERFACE_REGISTRY_INTERFACE_SYSTEM_LEVEL

paths:
  /api/v3/paths:
    post:
      tags:
        - paths
      summary: Path Search
      operationId: path_search_api_v3_paths_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathResponse'
        '503':
          description: Database unavailable
        '504':
          description: Database timeout
        '500':
          description: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-mcp-tool-name: build_path
      x-mcp-tool-description: Поиск путей интеграции. Возвращает отрезки source -> destination.

components:
  schemas:
    # ─────────────────────────────────────────────
    # Enums
    # ─────────────────────────────────────────────
    SourceType:
      type: string
      enum:
        - vision
        - interface_registry
      title: SourceType
      description: >
        Источник данных для поиска пути:
          - `vision` — VISION_INTERFACE_SYSTEM_LEVEL
          - `interface_registry` — INTERFACE_REGISTRY_INTERFACE_SYSTEM_LEVEL

    TraverseSortBy:
      type: string
      enum:
        - most_frequent
        - longest
        - shortest
        - most_recent
      title: TraverseSortBy
      description: >
        Порядок сортировки результатов:
          - `most_frequent` — по убыванию частоты
          - `longest` — сначала самые длинные пути
          - `shortest` — сначала самые короткие пути
          - `most_recent` — сначала самые свежие

    # ─────────────────────────────────────────────
    # Request
    # ─────────────────────────────────────────────
    PathRequest:
      type: object
      title: PathRequest
      description: >
        Запрос на поиск путей интеграции между двумя системами
        с возможностью фильтрации по модулям/компонентам и выбором источника данных.
      required:
        - start
        - finish
      properties:
        source:
          allOf:
            - $ref: '#/components/schemas/SourceType'
          description: >
            Тип источника данных для поиска.
            Определяет, какой edge type используется в запросах к NebulaGraph.
          default: vision
          x-mcp-tool-arg-name: source
          x-mcp-tool-arg-description: >
            Источник данных: vision (VISION_INTERFACE_SYSTEM_LEVEL)
            или interface_registry (INTERFACE_REGISTRY_INTERFACE_SYSTEM_LEVEL)

        start:
          $ref: '#/components/schemas/TraverseFilter'
          description: Фильтр для начальных узлов поиска пути
          x-mcp-tool-arg-description: Фильтр для начальных узлов поиска пути
          x-mcp-tool-arg-name: start

        finish:
          $ref: '#/components/schemas/TraverseFilter'
          description: Фильтр для конечных узлов поиска пути
          x-mcp-tool-arg-description: Фильтр для конечных узлов поиска пути
          x-mcp-tool-arg-name: finish

        sort_by:
          allOf:
            - $ref: '#/components/schemas/TraverseSortBy'
          description: Порядок сортировки результатов
          default: most_frequent
          x-mcp-tool-arg-description: >
            Порядок сортировки: most_frequent (по частоте), longest (самые длинные),
            shortest (самые короткие), most_recent (недавние)
          x-mcp-tool-arg-name: sort_by

        path_count:
          type: integer
          minimum: 1
          maximum: 100
          title: Path Count
          description: Максимальное количество путей в ответе
          default: 10
          x-mcp-tool-arg-description: Количество путей в ответе (от 1 до 100)
          x-mcp-tool-arg-name: path_count

        depth_days:
          type: integer
          minimum: 1
          maximum: 365
          title: Depth Days
          description: Количество дней глубины поиска (от 1 до 365)
          default: 90
          x-mcp-tool-arg-description: Количество дней глубины поиска (от 1 до 365)
          x-mcp-tool-arg-name: depth_days



    TraverseFilter:
      type: object
      title: TraverseFilter
      description: >
        Фильтр для узла (системы, модуля, компонента).
        Все поля опциональны — если не указаны, фильтр не применяется.
      properties:
        system_rsm_id:
          anyOf:
            - type: string
            - type: 'null'
          title: System Rsm Id
          description: RSM ID системы
          default: null
          x-mcp-tool-arg-description: RSM ID системы для фильтрации
          x-mcp-tool-arg-name: system_rsm_id

        module_rsm_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Module Rsm Id
          description: RSM ID модуля
          default: null
          x-mcp-tool-arg-description: RSM ID модуля для фильтрации
          x-mcp-tool-arg-name: module_rsm_id

        component_rsm_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Component Rsm Id
          description: RSM ID компонента
          default: null
          x-mcp-tool-arg-description: RSM ID компонента для фильтрации
          x-mcp-tool-arg-name: component_rsm_id

    # ─────────────────────────────────────────────
    # Response
    # ─────────────────────────────────────────────
    PathResponse:
      type: object
      title: PathResponse
      required:
        - paths
      properties:
        paths:
          type: array
          title: Paths
          items:
            $ref: '#/components/schemas/PathGroup'
          description: Список найденных путей

    PathGroup:
      type: object
      title: PathGroup
      description: >
        Один найденный путь — группа сегментов между двумя системами.
        Может включать несколько альтернативных путей (разные цепочки систем).
      properties:
        segments:
          type: array
          title: Segments
          items:
            $ref: '#/components/schemas/PathSegment'
          default: []
          description: Сегменты пути (source → destination)
        description:
          type: string
          title: Description
          default: ''
          description: >
            Мета-информация о пути.
            Формат: `frequency: N | document_rsm_id: <id> | document_rsm_date_time: <date>`

    PathSegment:
      type: object
      title: PathSegment
      description: >
        Один отрезок пути source → destination.
        Направление определяется по ребру в графе.
      required:
        - source
        - destination
      properties:
        source:
          $ref: '#/components/schemas/PathSegmentSource'
          description: Система-источник (consumer/requester)

        destination:
          $ref: '#/components/schemas/PathSegmentDestination'
          description: Система-назначение (provider/responder)

        description:
          type: string
          title: Description
          default: ''
          description: Описание отрезка (зарезервировано)

    PathSegmentSource:
      type: object
      title: PathSegmentSource
      description: >
        Система-источник (consumer/requester) в отрезке пути.
        Определяется как consumer сторона ребра в графе.
      properties:
        system_rsm_id:
          type: string
          title: System Rsm Id
          default: ''
          description: RSM ID системы-источника

        system_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: System Rsm Name
          description: Наименование системы-источника

        module_rsm_id:
          type: string
          title: Module Rsm Id
          default: ''
          description: RSM ID модуля-источника (если применимо)

        module_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Module Rsm Name
          description: Наименование модуля-источника

        component_rsm_id:
          type: string
          title: Component Rsm Id
          default: ''
          description: RSM ID компонента-источника (если применимо)

        component_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Component Rsm Name
          description: Наименование компонента-источника

    PathSegmentDestination:
      type: object
      title: PathSegmentDestination
      description: >
        Система-назначение (provider/responder) в отрезке пути.
        Определяется как provider сторона ребра в графе.
      properties:
        system_rsm_id:
          type: string
          title: System Rsm Id
          default: ''
          description: RSM ID системы-назначения

        system_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: System Rsm Name
          description: Наименование системы-назначения

        module_rsm_id:
          type: string
          title: Module Rsm Id
          default: ''
          description: RSM ID модуля-назначения (если применимо)

        module_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Module Rsm Name
          description: Наименование модуля-назначения

        component_rsm_id:
          type: string
          title: Component Rsm Id
          default: ''
          description: RSM ID компонента-назначения (если применимо)

        component_rsm_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Component Rsm Name
          description: Наименование компонента-назначения

    # ─────────────────────────────────────────────
    # Errors
    # ─────────────────────────────────────────────
    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: array
          title: Detail
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      title: ValidationError
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          title: Location
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
